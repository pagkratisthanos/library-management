server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The router owns the paths, not the filesystem. Without this fallback a
    # refresh on /admin/books asks nginx for a file that does not exist and gets 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every asset filename, so a changed file gets a
    # new name and these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
