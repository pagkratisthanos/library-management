spring:
  application:
    name: library-management

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    # The services return entities and the controllers map them to DTOs, so the
    # persistence context must stay open for the whole request. Lazy loading that
    # this could hide is handled explicitly with @EntityGraph and @BatchSize.
    open-in-view: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  pattern:
    # MDCLoggingFilter puts the user and the client IP here. The defaults after ":-" cover the
    # lines written outside a request, such as startup.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{user:-system}@%X{ip:-local}] %logger{36} - %msg%n"

app:
  security:
    secret-key: ${APP_SECURITY_SECRET_KEY}
    jwt-expiration: ${APP_SECURITY_JWT_EXPIRATION:43200000}

springdoc:
  swagger-ui:
    persist-authorization: true